# Default values for springbootapp-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: springbootapps-springbootapp
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 8081

frontend:
  replicaCount: 1
  image:
    repository: springbootapps-react-frontend
    pullPolicy: Never
    tag: "latest"
  service:
    type: ClusterIP
    port: 80

appConfig:
  DB_HOST: "${MYSQL_HOST}"
  DB_PORT: "3306"
  DB_NAME: "employee_db"
  DB_USERNAME: "root"
  DB_PASSWORD: "root"
  SERVER_PORT: "8081"

mysql:
  enabled: true
  database: employee_db
  username: root
  password: root
  port: 3306

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  hosts:
    - host: qactsai.local
      paths:
        - path: /api/?(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: "{{ .Release.Name }}-springbootapp-chart"
              port:
                number: 8081
        - path: /actuator/?(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: "{{ .Release.Name }}-springbootapp-chart"
              port:
                number: 8081
        - path: /?(.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: "{{ .Release.Name }}-frontend"
              port:
                number: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
