version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-local
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the project directory so we can run scripts from it easily (optional, helpful for local)
      - ${PWD}:/workspace
      # Mount minikube and kube config for kubectl and helm access
      - ~/.kube:/root/.kube:ro
      - ~/.minikube:/Users/rohit/.minikube:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
