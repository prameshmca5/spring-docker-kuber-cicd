version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-local
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Mount the project directory so we can run scripts from it easily (optional, helpful for local)
      - ${PWD}:/workspace
      # Mount minikube and kube config for kubectl and helm access
      # ~/.kube is mounted read-only; we use a custom kubeconfig at /var/jenkins_home/minikube-kubeconfig
      - ~/.kube:/root/.kube:ro
      # IMPORTANT: mount to /root/.minikube (not /Users/rohit/.minikube) so cert paths in kubeconfig resolve
      - ~/.minikube:/root/.minikube:ro
    environment:
      # Custom kubeconfig with correct paths and minikube container IP
      - KUBECONFIG=/var/jenkins_home/minikube-kubeconfig
    networks:
      - default
      - minikube # Join minikube network so Jenkins can reach k8s API at 192.168.49.2:8443
    restart: unless-stopped

volumes:
  jenkins_home:


networks:
  default: {}
  minikube:
    external: true # The 'minikube' network is created by minikube
