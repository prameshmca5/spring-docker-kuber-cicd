apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: card-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: banking-platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: backend
  source:
    repoURL: https://github.com/prameshmca5/spring-docker-kuber-cicd.git
    targetRevision: cicd-docker-k8s-helm-argocd
    path: helm-charts/banking-service
    helm:
      releaseName: card-service
      valueFiles:
        - values-card-service.yaml
        - ../environments/dev/card-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
