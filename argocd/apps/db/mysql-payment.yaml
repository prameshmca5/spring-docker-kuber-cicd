apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-payment
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: banking-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: db
  source:
    repoURL: https://github.com/prameshmca5/spring-docker-kuber-cicd.git
    targetRevision: cicd-docker-k8s-helm-argocd
    path: helm-charts/dedicated-db
    helm:
      releaseName: mysql-payment
      parameters:
        - name: type
          value: mysql
        - name: name
          value: mysql-payment
        - name: mysql.database
          value: payment_db
  destination:
    server: https://kubernetes.default.svc
    namespace: db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
