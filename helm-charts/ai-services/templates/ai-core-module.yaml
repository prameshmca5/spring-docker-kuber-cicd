{{- if .Values.aiCoreModule.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.aiCoreModule.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.aiCoreModule.name }}
    version: v1
spec:
  type: {{ .Values.aiCoreModule.service.type }}
  ports:
    - port: {{ .Values.aiCoreModule.service.port }}
      targetPort: {{ .Values.aiCoreModule.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.aiCoreModule.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.aiCoreModule.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.aiCoreModule.name }}
spec:
  replicas: {{ .Values.aiCoreModule.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.aiCoreModule.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.aiCoreModule.name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Values.aiCoreModule.name }}
        image: "{{ .Values.aiCoreModule.image.repository }}:{{ .Values.aiCoreModule.image.tag }}"
        imagePullPolicy: {{ .Values.aiCoreModule.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.aiCoreModule.service.targetPort }}
          protocol: TCP
        env:
        - name: SPRING_APPLICATION_NAME
          value: {{ .Values.aiCoreModule.config.spring.application.name }}
        - name: SERVER_PORT
          value: "{{ .Values.aiCoreModule.service.targetPort }}"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: {{ .Values.serviceDiscovery.eureka.serverUrl }}
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://{{ .Values.database.postgres.host }}:{{ .Values.database.postgres.port }}/{{ .Values.database.postgres.database }}"
        - name: SPRING_DATASOURCE_USERNAME
          value: {{ .Values.database.postgres.username }}
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.postgres.passwordSecret }}
              key: {{ .Values.database.postgres.passwordKey }}
        - name: SPRING_REDIS_HOST
          value: {{ .Values.redis.host }}
        - name: SPRING_REDIS_PORT
          value: "{{ .Values.redis.port }}"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: {{ join "," .Values.kafka.brokers }}
        - name: LOGGING_LEVEL_ROOT
          value: {{ .Values.global.logLevel }}
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "*"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.aiCoreModule.resources | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

