# AI Services Helm Chart Values
# Configure AI microservices deployment

# Global settings
global:
  environment: dev  # dev, staging, prod
  logLevel: INFO

# Database Configuration for Model Registry
database:
  postgres:
    enabled: true
    host: postgres
    port: 5432
    database: ai_models
    username: admin
    passwordSecret: postgres-secret
    passwordKey: password

# Redis Configuration for Feature Store
redis:
  enabled: true
  host: redis
  port: 6379

# Kafka Configuration
kafka:
  enabled: true
  brokers:
    - "kafka:9092"

# Service Discovery (Eureka)
serviceDiscovery:
  eureka:
    enabled: true
    serverUrl: "http://discovery-server.backend.svc.cluster.local:8761/eureka/"
    registerWithEureka: true
    fetchRegistry: true

# Monitoring
monitoring:
  prometheus:
    enabled: true
    port: 9090

  metrics:
    enabled: true
    path: /actuator/metrics

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: "ai-services.local"
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Pod Security Context
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0

# Container Security Context
securityContext: {}

# Node Affinity (optional)
affinity: {}

# Tolerations (optional)
tolerations: []

# Image pull secrets (if using private registry)
imagePullSecrets: []
