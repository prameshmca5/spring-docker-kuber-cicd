# AI Services Helm Chart Values
# Configure AI microservices deployment

# Global settings
global:
  environment: dev  # dev, staging, prod
  logLevel: INFO

# AI Core Module Configuration
aiCoreModule:
  enabled: true
  name: ai-core-module
  replicaCount: 1
  image:
    repository: ai-core-module
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  config:
    spring:
      application:
        name: ai-core-module
      jpa:
        hibernate:
          ddl-auto: update

    management:
      endpoints:
        web:
          exposure:
            include: "*"

# Fraud Detection Service Configuration
fraudDetection:
  enabled: true
  name: ai-fraud-detection
  replicaCount: 2  # Higher replication for fraud detection
  image:
    repository: ai-fraud-detection
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9001
    targetPort: 9001

  resources:
    requests:
      memory: "768Mi"
      cpu: "500m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"

  config:
    spring:
      application:
        name: ai-fraud-detection

    ai:
      fraud:
        daily-limit: 100000.0
        single-transaction-limit: 50000.0
        max-transactions-per-hour: 10
        velocity-threshold: 5000.0

    management:
      endpoints:
        web:
          exposure:
            include: "*"

  kafka:
    enabled: true
    bootstrapServers: "kafka:9092"
    topics:
      fraud-alerts: "fraud.alerts"
      manual-review: "fraud.manual.review"
      analyzed-transactions: "fraud.transactions.analyzed"

# Credit Service Configuration
creditService:
  enabled: false  # Enable when ready
  name: ai-credit-service
  replicaCount: 1
  image:
    repository: ai-credit-service
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9002
    targetPort: 9002

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Recommendations Service Configuration
recommendationService:
  enabled: false  # Enable when ready
  name: ai-recommendation-service
  replicaCount: 1
  image:
    repository: ai-recommendation-service
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9003
    targetPort: 9003

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Analytics Service Configuration
analyticsService:
  enabled: false  # Enable when ready
  name: ai-analytics-service
  replicaCount: 1
  image:
    repository: ai-analytics-service
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9004
    targetPort: 9004

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Chatbot Service Configuration
chatbotService:
  enabled: false  # Enable when ready
  name: ai-chatbot-service
  replicaCount: 1
  image:
    repository: ai-chatbot-service
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 9005
    targetPort: 9005

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Database Configuration for Model Registry
database:
  postgres:
    enabled: true
    host: postgres
    port: 5432
    database: ai_models
    username: admin
    passwordSecret: postgres-secret
    passwordKey: password

# Redis Configuration for Feature Store
redis:
  enabled: true
  host: redis
  port: 6379

# Kafka Configuration
kafka:
  enabled: true
  brokers:
    - "kafka:9092"

# Service Discovery (Eureka)
serviceDiscovery:
  eureka:
    enabled: true
    serverUrl: "http://discovery-server.backend.svc.cluster.local:8761/eureka/"
    registerWithEureka: true
    fetchRegistry: true

# Monitoring
monitoring:
  prometheus:
    enabled: true
    port: 9090

  metrics:
    enabled: true
    path: /actuator/metrics

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: "ai-services.local"
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Pod Security Context
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0

# Container Security Context
securityContext: {}

# Node Affinity (optional)
affinity: {}

# Tolerations (optional)
tolerations: []

# Image pull secrets (if using private registry)
imagePullSecrets: []

