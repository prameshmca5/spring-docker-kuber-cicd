apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: springbootapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-frontend
            port:
              number: 80
