---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'spring-k8s-local'

    rule_files:
      - "/etc/prometheus/alert_rules.yml"
      - "/etc/prometheus/recording_rules.yml"

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    scrape_configs:

      # ── Spring Boot Microservices (Actuator /actuator/prometheus) ──────────
      - job_name: 'spring-microservices'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['backend']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── Explicit scrape targets for each service ──────────────────────────
      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-gateway.backend.svc.cluster.local:8080']
            labels:
              service: 'api-gateway'

      - job_name: 'payment-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['payment-service.backend.svc.cluster.local:8085']
            labels:
              service: 'payment-service'

      - job_name: 'auth-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['auth-service.backend.svc.cluster.local:8089']
            labels:
              service: 'auth-service'

      - job_name: 'account-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['account-service.backend.svc.cluster.local:8081']
            labels:
              service: 'account-service'

      - job_name: 'transaction-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['transaction-service.backend.svc.cluster.local:8083']
            labels:
              service: 'transaction-service'

      - job_name: 'notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['notification-service.backend.svc.cluster.local:8084']
            labels:
              service: 'notification-service'

      - job_name: 'customer-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['customer-service.backend.svc.cluster.local:8082']
            labels:
              service: 'customer-service'

      - job_name: 'discovery-server'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['discovery-server.backend.svc.cluster.local:8761']
            labels:
              service: 'discovery-server'

      # ── Kafka Exporter ────────────────────────────────────────────────────
      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter.monitoring.svc.cluster.local:9308']
            labels:
              service: 'kafka'

      # ── kube-state-metrics ───────────────────────────────────────────────
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      # ── Node Exporter ─────────────────────────────────────────────────────
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      # ── Pushgateway ──────────────────────────────────────────────────────
      - job_name: 'pushgateway'
        honor_labels: true
        static_configs:
          - targets: ['pushgateway.monitoring.svc.cluster.local:9091']

      # ── Prometheus itself ─────────────────────────────────────────────────
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'grafana'
        static_configs:
          - targets: ['grafana.monitoring.svc.cluster.local:3000']

      - job_name: 'loki'
        static_configs:
          - targets: ['loki.monitoring.svc.cluster.local:3100']

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

  recording_rules.yml: |
    groups:
    - name: spring_boot_performance
      rules:
      - record: job:http_server_requests_seconds_count:rate5m
        expr: sum by (service, method) (rate(http_server_requests_seconds_count[5m]))
      - record: job:http_server_requests_seconds_sum:rate5m
        expr: sum by (service, method) (rate(http_server_requests_seconds_sum[5m]))
      - record: service:jvm_memory_used_ratio
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}
      - record: service:cpu_usage_ratio
        expr: sum by (service) (rate(process_cpu_usage[5m]))

  alert_rules.yml: |
    groups:
    - name: system_health
      rules:
      - alert: Watchdog
        expr: vector(1)
        for: 1m
        labels:
          severity: none
        annotations:
          summary: "Watchdog Alert"
          description: "This alert is always firing to ensure the alerting pipeline is operational."

    - name: microservices
      rules:
      - alert: ServiceDown
        expr: up{namespace="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Microservice Down: {{ $labels.service }}"
          description: "Service {{ $labels.service }} has been down for more than 1 minute in namespace {{ $labels.namespace }}."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Error Rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is returning 5xx errors ({{ $value }} req/s)."
      - alert: HighMemoryUsage
        expr: service:jvm_memory_used_ratio > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "JVM Memory Leak Detected: {{ $labels.service }}"
          description: "Memory usage for {{ $labels.service }} is above 90% for 5 minutes."
      - alert: HighCPUUsage
        expr: service:cpu_usage_ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage: {{ $labels.service }}"
          description: "CPU usage for {{ $labels.service }} is above 85% for 5 minutes."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics, /actuator/prometheus]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
            - --web.external-url=http://prometheus.local/
            - --web.route-prefix=/
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 32090
      name: http
  selector:
    app: prometheus
