apiVersion: v1
kind: ConfigMap
metadata:
  name: global-infrastructure-config
  namespace: backend
data:
  EUREKA_SERVER_URL: "http://discovery-server.backend.svc.cluster.local:8761/eureka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.external-tools.svc.cluster.local:9092"
  MYSQL_HOST: "mysql.db.svc.cluster.local"
  POSTGRES_HOST: "springbootapp-db-postgres.db.svc.cluster.local"
  DB2_HOST: "db2.db.svc.cluster.local"
  DB2_PORT: "50000"
  JAEGER_OTLP_ENDPOINT: "http://jaeger.monitoring.svc.cluster.local:4318/v1/traces"
  MANAGEMENT_TRACING_ENABLED: "false"
  OTEL_SAMPLING_PROBABILITY: "1.0"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: "DEBUG"
  LOGGING_LEVEL_COM_EXAMPLE: "DEBUG"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
  ELASTIC_APM_ENABLED: "true"
  ELASTIC_APM_ENVIRONMENT: "kubernetes"
  ELASTIC_APM_SERVER_URL: "http://apm-server.monitoring.svc.cluster.local:8200"
  ELASTIC_APM_SERVER_URLS: "http://apm-server.monitoring.svc.cluster.local:8200"
  ELASTIC_APM_LOG_LEVEL: "INFO"
  ELASTIC_APM_ENABLE_LOG_CORRELATION: "true"
  ELASTIC_APM_LOG_ECS_REFORMATTING: "OFF"
  ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "1.0"
