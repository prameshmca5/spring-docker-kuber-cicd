{{- if .Values.createService | default true -}}
apiVersion: v1
kind: Service
metadata:
    name: {{.Values.serviceName}}
    labels:
        app: {{.Values.serviceName}}
spec:
    type: {{.Values.service.type}}
    ports:
        - port: {{.Values.service.port}}
          targetPort: http
          protocol: TCP
          name: http
    selector:
        app: {{.Values.serviceName}}
        color: {{ .Values.activeColor | default "blue" }}
{{- end }}
