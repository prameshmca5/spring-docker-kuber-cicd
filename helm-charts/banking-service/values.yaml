# Default values for banking-service
serviceName: "example-service"

replicaCount: 1

image:
  repository: "springbootapps-example-service"
  pullPolicy: Never
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

appConfig: {}

ingress:
  enabled: false
  host: "qactsai.local"
  annotations: {}

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
