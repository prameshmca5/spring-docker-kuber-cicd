server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: false
                    lower-case-service-id: true
            routes:
                - id: auth-service
                  uri: http://auth-service.backend.svc.cluster.local:8089
                  predicates:
                      - Path=/api/v1/auth/**
                - id: employee-service
                  uri: http://employee-service:8080
                  predicates:
                      - Path=/api/v1/employees/**
                  filters:
                      - AuthenticationFilter
                - id: account-service
                  uri: http://account-service:8081
                  predicates:
                      - Path=/api/v1/accounts/**
                  filters:
                      - AuthenticationFilter
                - id: customer-service
                  uri: http://customer-service:8082
                  predicates:
                      - Path=/api/v1/customers/**
                  filters:
                      - AuthenticationFilter
                - id: transaction-service
                  uri: http://transaction-service:8083
                  predicates:
                      - Path=/api/v1/transactions/**
                  filters:
                      - AuthenticationFilter
                - id: notification-service
                  uri: http://notification-service:8084
                  predicates:
                      - Path=/api/v1/notifications/**
                  filters:
                      - AuthenticationFilter
                - id: payment-service
                  uri: http://payment-service:8085
                  predicates:
                      - Path=/api/v1/payments/**
                  filters:
                      - AuthenticationFilter
                - id: common-service
                  uri: http://common-service:8087
                  predicates:
                      - Path=/api/common/**
                  filters:
                      - AuthenticationFilter

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server.backend.svc.cluster.local:8761/eureka/}

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            probes:
                enabled: true
            show-details: always
    health:
        livenessstate:
            enabled: true
        readinessstate:
            enabled: true
