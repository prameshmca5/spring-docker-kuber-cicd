server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:
                - id: employee-service
                  uri: lb://employee-service
                  predicates:
                      - Path=/api/v1/employees/**
                - id: account-service
                  uri: lb://account-service
                  predicates:
                      - Path=/api/v1/accounts/**
                - id: customer-service
                  uri: lb://customer-service
                  predicates:
                      - Path=/api/v1/customers/**
                - id: transaction-service
                  uri: lb://transaction-service
                  predicates:
                      - Path=/api/v1/transactions/**
                - id: notification-service
                  uri: lb://notification-service
                  predicates:
                      - Path=/api/v1/notifications/**
                - id: payment-service
                  uri: lb://payment-service
                  predicates:
                      - Path=/api/v1/payments/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            probes:
                enabled: true
            show-details: always
    health:
        livenessstate:
            enabled: true
        readinessstate:
            enabled: true
