name: Docker Hub GitOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - develop-github-cicd
  pull_request:
    branches:
      - main
      - develop
      - develop-github-cicd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-gitops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  SERVICES: "account-service api-gateway auth-service common-service customer-service discovery-server employee-service notification-service payment-service transaction-service"
  FRONTEND_IMAGE: react-frontend

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Package Spring services
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Build React frontend
        working-directory: react-frontend
        run: |
          npm ci
          npm run build

  publish-images:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tag
        id: version
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package Spring services
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Build and push backend images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          for service in $SERVICES; do
            image="${REGISTRY}/${DOCKERHUB_USERNAME}/${service}"
            docker build -t "${image}:${IMAGE_TAG}" -t "${image}:latest" "./${service}"
            docker push "${image}:${IMAGE_TAG}"
            docker push "${image}:latest"
          done

      - name: Build and push frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          image="${REGISTRY}/${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE}"
          docker build -t "${image}:${IMAGE_TAG}" -t "${image}:latest" ./react-frontend
          docker push "${image}:${IMAGE_TAG}"
          docker push "${image}:latest"

  update-gitops:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: publish-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Helm image references
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
        run: bash update-gitops-values.sh "$DOCKERHUB_USERNAME" "$IMAGE_TAG"

      - name: Commit GitOps updates
        env:
          IMAGE_TAG: ${{ needs.publish-images.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-charts/banking-service/values-*.yaml helm-charts/springbootapp-frontend/values.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update image tags to ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
