name: Docker Hub GitOps Pipeline

on:
  push:
    branches:
      - cicd-docker-k8s-helm-argocd
  pull_request:
    branches:
      - cicd-docker-k8s-helm-argocd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-gitops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: react-frontend

jobs:
  detect-changes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      any_images_changed: ${{ steps.detect.outputs.any_images_changed }}
      backend_services_csv: ${{ steps.detect.outputs.backend_services_csv }}
      backend_services_json: ${{ steps.detect.outputs.backend_services_json }}
      image_tag: ${{ steps.detect.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          bash ./detect-changed-components.sh "${BASE_SHA}" "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  validate:
    needs: detect-changes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: needs.detect-changes.outputs.backend_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        if: needs.detect-changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Package changed backend services
        if: needs.detect-changes.outputs.backend_changed == 'true'
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Build changed React frontend
        if: needs.detect-changes.outputs.frontend_changed == 'true'
        working-directory: react-frontend
        run: |
          npm ci
          npm run build

      - name: No image-bearing changes detected
        if: needs.detect-changes.outputs.any_images_changed != 'true'
        run: echo "No backend service or frontend source changes detected; skipping image validation."

  publish-images:
    needs:
      - detect-changes
      - validate
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && needs.detect-changes.outputs.any_images_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: needs.detect-changes.outputs.backend_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package changed backend services
        if: needs.detect-changes.outputs.backend_changed == 'true'
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Build and push changed backend images
        if: needs.detect-changes.outputs.backend_changed == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          CHANGED_BACKEND_SERVICES: ${{ needs.detect-changes.outputs.backend_services_csv }}
        run: |
          IFS=',' read -r -a services <<< "${CHANGED_BACKEND_SERVICES}"
          for service in "${services[@]}"; do
            [[ -z "${service}" ]] && continue
            image="${REGISTRY}/${DOCKERHUB_USERNAME}/${service}"
            docker image rm "${image}:${IMAGE_TAG}" || true
            docker build --pull --no-cache -t "${image}:${IMAGE_TAG}" "./${service}"
            docker push "${image}:${IMAGE_TAG}"
          done

      - name: Build and push changed frontend image
        if: needs.detect-changes.outputs.frontend_changed == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
        run: |
          image="${REGISTRY}/${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE}"
          docker image rm "${image}:${IMAGE_TAG}" || true
          docker build --pull --no-cache -t "${image}:${IMAGE_TAG}" ./react-frontend
          docker push "${image}:${IMAGE_TAG}"

  update-gitops:
    needs:
      - detect-changes
      - publish-images
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]' && needs.detect-changes.outputs.any_images_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Helm image references
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
          CHANGED_BACKEND_SERVICES: ${{ needs.detect-changes.outputs.backend_services_csv }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend_changed }}
        run: bash update-gitops-values.sh "$DOCKERHUB_USERNAME" "$IMAGE_TAG" "$CHANGED_BACKEND_SERVICES" "$FRONTEND_CHANGED"

      - name: Commit GitOps updates
        env:
          IMAGE_TAG: ${{ needs.detect-changes.outputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-charts/banking-service/values-*.yaml helm-charts/springbootapp-frontend/values.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update changed image tags to ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
